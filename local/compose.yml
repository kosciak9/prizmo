# Development Docker Compose configuration
#
# Works standalone (defaults for main branch) or with env vars (worktree mode).
# Environment variables (set via .env.local for worktrees):
#   COMPOSE_PROJECT_NAME - e.g., prizmo-feature-auth (default: prizmo)
#   DB_PORT              - Postgres port (mapped to container 5432)
#   S3_PORT              - SeaweedFS S3 port (mapped to container 8333)

services:
  db:
    image: paradedb/paradedb:v0.25.0-pg18@sha256:6e35d14c72f1eef9be6c8d9ac40185f877f8e119f691ece20906793d765fb8f7
    container_name: ${COMPOSE_PROJECT_NAME:-prizmo}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prizmo_dev
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: docker.io/chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    container_name: ${COMPOSE_PROJECT_NAME:-prizmo}-s3
    command: server -s3
    ports:
      - "${S3_PORT:-4570}:8333"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  seaweedfs_data:
