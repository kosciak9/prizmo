version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    groups:
      mix-non-breaking:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 15

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    groups:
      npm-non-breaking:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 15

  - package-ecosystem: docker-compose
    directory: /local
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    groups:
      github-actions-non-breaking:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 15
